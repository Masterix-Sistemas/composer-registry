name: Configure registry reader authentication
description: Mint a read-only package token and configure Composer to use it.

inputs:
  app-id:
    description: GitHub App ID for composer-registry-reader.
    required: true
  private-key:
    description: GitHub App private key for composer-registry-reader.
    required: true

runs:
  using: composite
  steps:
    - id: app-token
      uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: Masterix-Sistemas
        repositories: identity-access

    - shell: bash
      env:
        COMPOSER_HOME: ${{ runner.temp }}/composer
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        mkdir -p "$COMPOSER_HOME"
        composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"
