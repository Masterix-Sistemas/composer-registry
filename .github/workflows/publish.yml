name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - id: app-token
        uses: actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42 # v2.1.4
        with:
          app-id: ${{ secrets.COMPOSER_REGISTRY_READER_APP_ID }}
          private-key: ${{ secrets.COMPOSER_REGISTRY_READER_PRIVATE_KEY }}

      - name: Configure Composer authentication
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          mkdir -p "$COMPOSER_HOME"
          composer config --global --auth github-oauth.github.com "$GITHUB_TOKEN"

      - name: Build Composer metadata
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/build" \
            --volume "$COMPOSER_HOME:/composer" \
            composer/satis@sha256:6262eb4a007086b5589b7558789caf3d3e78c570481c5e0638398c00c4661df1 \
            build /build/satis.json /build/public

      - name: Verify generated catalog
        run: |
          test -f public/packages.json
          jq -e '."available-packages" | index("masterix/identity-access")' public/packages.json
          jq -e '.packages["masterix/identity-access"] | any(.version == "v0.1.32")' public/include/*.json
          test ! -d public/dist
          test ! -d public/downloads
          ! find public -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \) -print -quit | grep -q .

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
