name: publish

on:
  repository_dispatch:
    types:
      - composer-package-released
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PACKAGE: ${{ github.event.client_payload.package || '' }}
      EXPECTED_TAG: ${{ github.event.client_payload.tag || '' }}

    steps:
      - name: Validate release dispatch
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          PACKAGE: ${{ github.event.client_payload.package }}
          TAG: ${{ github.event.client_payload.tag }}
        run: |
          test -n "$PACKAGE"
          test -n "$TAG"
          jq -e --arg package "$PACKAGE" \
            '(.require | keys) | index($package)' satis.json >/dev/null

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/configure-reader-auth
        with:
          app-id: ${{ secrets.COMPOSER_REGISTRY_READER_APP_ID }}
          private-key: ${{ secrets.COMPOSER_REGISTRY_READER_PRIVATE_KEY }}

      - name: Build Composer metadata
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
        run: |
          docker run --rm --init \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/build" \
            --volume "$COMPOSER_HOME:/composer" \
            composer/satis@sha256:6262eb4a007086b5589b7558789caf3d3e78c570481c5e0638398c00c4661df1 \
            build /build/satis.json /build/public

      - name: Verify generated catalog
        run: |
          test -f public/packages.json
          jq -e --slurpfile config satis.json '
            ($config[0].require | keys) as $required
            | (."available-packages" // []) as $available
            | all($required[]; . as $package | ($available | index($package)))
          ' public/packages.json
          if [ "$GITHUB_EVENT_NAME" = 'repository_dispatch' ]; then
            jq -e --slurp --arg package "$EXPECTED_PACKAGE" --arg tag "$EXPECTED_TAG" \
              'map(.packages[$package] // []) | flatten | any(.version == $tag)' \
            public/include/*.json
          fi
          test ! -d public/dist
          test ! -d public/downloads
          ! find public -type f \( -name '*.zip' -o -name '*.tar' -o -name '*.tar.gz' -o -name '*.tgz' \) -print -quit | grep -q .

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  verify-consumer:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.5"
          tools: composer:v2

      - uses: ./.github/actions/configure-reader-auth
        with:
          app-id: ${{ secrets.COMPOSER_REGISTRY_READER_APP_ID }}
          private-key: ${{ secrets.COMPOSER_REGISTRY_READER_PRIVATE_KEY }}

      - name: Install from published catalog
        env:
          COMPOSER_HOME: ${{ runner.temp }}/composer
          REGISTRY_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          mkdir -p "$COMPOSER_HOME" "$RUNNER_TEMP/consumer"
          curl --fail --retry 12 --retry-delay 5 "${REGISTRY_URL%/}/packages.json" >/dev/null
          cd "$RUNNER_TEMP/consumer"
          composer init --name=masterix/registry-verification --no-interaction
          composer config repositories.masterix composer "$REGISTRY_URL"
          composer require masterix/identity-access:v0.1.32 --no-interaction --no-progress
